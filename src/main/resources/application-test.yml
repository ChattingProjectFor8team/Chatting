spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:mysql://localhost:3306/infinite_test?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 110          # 100 스레드 동시성 테스트 + 여유분
      connection-timeout: 120000      # 비관적 락 대기 120초
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

