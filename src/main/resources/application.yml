spring:
  application:
    name: demo
  config:
    import: optional:classpath:application-local.yml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        enabled: true
        bucket: ${AWS_S3_BUCKET}
        domain: ${CLOUDFRONT_DOMAIN:http://localhost:8080}
      parameterstore:
        enabled: false
      secretsmanager:
        enabled: false

  # 1. [수정] spring: 하위로 정확히 들여쓰기 (공백 2칸)
  datasource:
    # [보안강화] useSSL=true로 변경하고 보안 관련 옵션 정리
    url: jdbc:mysql://${RDS_HOST}:3306/infinite?allowPublicKeyRetrieval=false&useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 1. [수정] spring: 하위로 정확히 들여쓰기 (공백 2칸)
  jpa:
    hibernate:
      # 2. [수정] 운영 환경은 무조건 validate 또는 none! (데이터 삭제 방지)
      ddl-auto: validate
    # 3. [수정] 운영 환경 성능을 위해 false로 변경 (로그 I/O 병목 제거)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# --- 이하 설정은 기존과 동일 (들여쓰기 주의) ---
jwt:
  secret: ${JWT_SECRET_KEY:aW5maW5pdGVMb2NhbERldlNlY3JldEtleU1pbmltdW0zMkJ5dGVz}
  expiration: 3600000

portone:
  api-secret: ${PORTONE_API_SECRET:test_dummy_secret_for_local}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:test_dummy_webhook_secret_for_local}

jelly:
  price-per-unit: 300
  fan-membership-cost: 9
  dm-subscription-cost: 15

artist-post:
  like-count:
    flush-delay-ms: 3000
    reconcile-cron: 0 0 4 * * *
  like-v3:
    consumer-delay-ms: 300
  comment-count:
    flush-delay-ms: 3000
    reconcile-cron: 0 10 4 * * *
  comment-v2:
    consumer-delay-ms: 300

media:
  storage:
    enabled: ${MEDIA_STORAGE_ENABLED:false}
    bucket: ${MEDIA_STORAGE_BUCKET:}
    region: ${MEDIA_STORAGE_REGION:ap-northeast-2}
    endpoint: ${MEDIA_STORAGE_ENDPOINT:}
    public-base-url: ${MEDIA_STORAGE_PUBLIC_BASE_URL:}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:}
    path-style-access: ${MEDIA_STORAGE_PATH_STYLE_ACCESS:false}
    key-prefix: ${MEDIA_STORAGE_KEY_PREFIX:post-media}
    max-image-count: 10
    max-video-count: 1
    max-image-size-bytes: 10485760
    max-video-size-bytes: 104857600
    allowed-image-extensions: jpg,jpeg,png,gif,webp
    allowed-video-extensions: mp4,mov,webm
  youtube:
    api-key: ${YOUTUBE_DATA_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always