spring:
  application:
    name: demo
  # 로컬 전용 설정 파일이 있으면 기본 설정 위에 덮어쓴다.
  config:
    import: optional:classpath:application-local.yml
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    aws:
      cloudfront:
        domain: https://dxxxxxxxxx.cloudfront.net

# JWT
jwt:
  secret: ${JWT_SECRET_KEY:aW5maW5pdGVMb2NhbERldlNlY3JldEtleU1pbmltdW0zMkJ5dGVz}
  expiration: 3600000

# PortOne
portone:
  api-secret: ${PORTONE_API_SECRET:test_dummy_secret_for_local}
  # 웹훅 서명 검증용 시크릿 — PortOne 콘솔에서 발급, 운영 환경에서는 반드시 환경변수로 주입
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:test_dummy_webhook_secret_for_local}

# Jelly
jelly:
  price-per-unit: 300
  fan-membership-cost: 9
  dm-subscription-cost: 15

media:
  storage:
    # 기본은 비활성화로 두고, S3 설정이 준비된 환경에서만 활성화한다.
    enabled: ${MEDIA_STORAGE_ENABLED:false}
    bucket: ${MEDIA_STORAGE_BUCKET:}
    region: ${MEDIA_STORAGE_REGION:ap-northeast-2}
    endpoint: ${MEDIA_STORAGE_ENDPOINT:}
    public-base-url: ${MEDIA_STORAGE_PUBLIC_BASE_URL:}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:}
    path-style-access: ${MEDIA_STORAGE_PATH_STYLE_ACCESS:false}
    key-prefix: ${MEDIA_STORAGE_KEY_PREFIX:post-media}
    max-image-count: 10
    max-video-count: 1
    max-image-size-bytes: 10485760
    max-video-size-bytes: 104857600
    allowed-image-extensions: jpg,jpeg,png,gif,webp
    allowed-video-extensions: mp4,mov,webm
