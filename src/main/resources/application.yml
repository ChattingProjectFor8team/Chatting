spring:
  application:
    name: demo
  config:
    import: optional:classpath:application-local.yml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    aws:
      credentials:
        # [수정] 팀원들 로컬 부팅 안 깨지게 dummy 기본값 추가
        access-key: ${AWS_ACCESS_KEY_ID:dummy}
        secret-key: ${AWS_SECRET_ACCESS_KEY:dummy}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        enabled: true
        bucket: ${AWS_S3_BUCKET:dummy-bucket}
        domain: ${CLOUDFRONT_DOMAIN:http://localhost:8080}
      parameterstore:
        enabled: false
      secretsmanager:
        enabled: false

  datasource:
    # [수정 1] 팀원들을 위해 :localhost 등 기본값(Fallback) 추가
    # [수정 2] 로컬 개발용이므로 useSSL=false 유지 (접속 편의성)
    url: jdbc:mysql://${RDS_HOST:localhost}:3306/infinite?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:1234} # 팀 로컬 DB 비번에 맞춰 수정하세요 (ex: root, 1234 등)
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # 로컬에서는 디버깅을 위해 SQL 보이게 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# --- 이하 설정은 기존과 동일 (JWT, portone 등 변수 뒤에 :기본값 붙은 것 유지) ---
jwt:
  secret: ${JWT_SECRET_KEY:aW5maW5pdGVMb2NhbERldlNlY3JldEtleU1pbmltdW0zMkJ5dGVz}
  expiration: 3600000

portone:
  api-secret: ${PORTONE_API_SECRET:test_dummy_secret_for_local}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:test_dummy_webhook_secret_for_local}

jelly:
  price-per-unit: 300
  fan-membership-cost: 9
  dm-subscription-cost: 15

artist-post:
  like-count:
    flush-delay-ms: 3000
    reconcile-cron: 0 0 4 * * *
  like-v3:
    consumer-delay-ms: 300
  comment-count:
    flush-delay-ms: 3000
    reconcile-cron: 0 10 4 * * *
  comment-v2:
    consumer-delay-ms: 300

media:
  storage:
    enabled: ${MEDIA_STORAGE_ENABLED:false}
    bucket: ${MEDIA_STORAGE_BUCKET:}
    region: ${MEDIA_STORAGE_REGION:ap-northeast-2}
    endpoint: ${MEDIA_STORAGE_ENDPOINT:}
    public-base-url: ${MEDIA_STORAGE_PUBLIC_BASE_URL:}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:}
    path-style-access: ${MEDIA_STORAGE_PATH_STYLE_ACCESS:false}
    key-prefix: ${MEDIA_STORAGE_KEY_PREFIX:post-media}
    max-image-count: 10
    max-video-count: 1
    max-image-size-bytes: 10485760
    max-video-size-bytes: 104857600
    allowed-image-extensions: jpg,jpeg,png,gif,webp
    allowed-video-extensions: mp4,mov,webm
  youtube:
    api-key: ${YOUTUBE_DATA_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always