name: CI/CD Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main,develop]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용 (체크아웃 - Repo에 있는 코드를 Runner에 옮김)

jobs:
  build:
    runs-on: ubuntu-latest
      # ── [추가] Redis 컨테이너 서비스 ──
    services:
        redis:
          image: redis:latest
          ports:
            - 6379:6379
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        mysql:
          image: mysql:8.0
          ports:
            - 3306:3306
          env:
            MYSQL_ROOT_PASSWORD: test
            MYSQL_DATABASE: infinite_test
          options: >-
            --health-cmd "mysqladmin ping -h localhost"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 커밋 해시 추출
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 3: 스프링 빌드를 위한 Java 21 설치
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      # Step 4: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            

      # Step 5-1: 실행 권한 부여 (추가 권장)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 5-2: 테스트 실행
      - name: Run tests
        run: ./gradlew test --stacktrace --info
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # application.yml에서 사용하는 정확한 변수명으로 매핑하세요!
          AWS_REGION: ap-northeast-2
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          # 👈 이 부분! 만약 yml에 ${AWS_S3_BUCKET}라고 되어있다면 아래처럼 맞춰야 합니다.
          AWS_S3_BUCKET: dummy-bucket
          # 만약 S3_BUCKET_NAME으로 쓰고 싶다면 yml도 ${S3_BUCKET_NAME}이어야 합니다.

          JWT_SECRET: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLWJhc2U2NA==
          JWT_SECRET_KEY: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLWJhc2U2NA==

          JWT_EXPIRATION: 3600000


#          # 테스트 코드가 localhost:6379로 붙을 수 있게 설정
#          SPRING_DATA_REDIS_HOST: localhost
#          SPRING_DATA_REDIS_PORT: 6379
#          # PlaceholderResolutionException 방지를 위한 필수 변수들 (임시값)
#          AWS_REGION: ${{ vars.AWS_REGION }}
#          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
#          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }} # 변수 처리!
#          # 필요한 다른 환경변수가 있다면 여기에 추가하세요
#          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN || 'mock.cloudfront.net' }}

      # Step 5: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 6: ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2


      # 도커 빌드 전에 QEMU 에뮬레이터 설치 스텝 추가
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 7: Docker 빌드 및 push (보완 버전)
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # 변수 가독성을 위해 REPO_URL 설정
          REPO_URL=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          # 1. 빌드 (플랫폼은 대상 EC2 사양에 맞춰 수정하세요)
          docker build --platform linux/arm64 \
            -t $REPO_URL:$SHORT_SHA \
            -t $REPO_URL:latest .
          
          # 2. 모든 태그 Push
          docker push $REPO_URL:$SHORT_SHA
          docker push $REPO_URL:latest
          
          echo "✅ Pushed Image Tag: $SHORT_SHA and latest"


  deploy:
    needs: build
    if: contains(fromJson('["refs/heads/main", "refs/heads/develop", "refs/heads/hotfix/env/var"]'), github.ref)
#    if: github.ref == 'refs/heads/main'   # main push에서만 배포 (PR에서는 CI만 실행)
    runs-on: ubuntu-latest

    steps:
      # Step 1: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 2: Launch Template 새 버전 생성
      - name: Update Launch Template
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
        run: |
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          # base64 인코딩 (줄바꿈 방지)
          USER_DATA=$(cat <<'USERDATA' | sed "s|__IMAGE_TAG__|${IMAGE_TAG}|g; s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g; s|__AWS_REGION__|${AWS_REGION}|g; s|__ECR_REPOSITORY__|${ECR_REPOSITORY}|g" | base64 -w 0
          #!/bin/bash
          set -e
          AWS_REGION="__AWS_REGION__"
          AWS_ACCOUNT_ID="__AWS_ACCOUNT_ID__"
          ECR_REPOSITORY="__ECR_REPOSITORY__"
          IMAGE_TAG="__IMAGE_TAG__"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          dnf update -y
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
          docker pull ${ECR_URI}:${IMAGE_TAG}
          docker run -d -p 8080:8080 --restart unless-stopped --name ci-demo -e SPRING_PROFILES_ACTIVE=prod ${ECR_URI}:${IMAGE_TAG}
          USERDATA
          )

          # [중요] 변수를 큰따옴표로 감싸서 공백 에러 방지
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"$USER_DATA\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "✅ Launch Template v${NEW_VERSION} 생성 완료"

          aws ec2 modify-launch-template \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --default-version "$NEW_VERSION"

          echo "✅ 기본 버전 → v${NEW_VERSION} 변경 완료"

      # Step 3: Instance Refresh 시작
      - name: Start Instance Refresh
        id: refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${ASG_NAME} \
            --preferences '{
              "MinHealthyPercentage": 100,
              "InstanceWarmup": 120
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "✅ Instance Refresh 시작: ${REFRESH_ID}"

      # Step 4: Instance Refresh 완료 대기
      - name: Wait for Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          echo "⏳ Instance Refresh 완료 대기 중..."

          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${ASG_NAME} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "시도 ${i}/30 - 상태: ${STATUS}"

            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ Instance Refresh 성공! 배포 완료!"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ Instance Refresh 실패: ${STATUS}"
              exit 1
            fi

            sleep 30
          done

          echo "❌ Instance Refresh 타임아웃 (15분 초과)"
          exit 1