name: CI/CD Pipeline

on:
  push:
    # [수정 4] hotfix 브랜치에서도 동작하도록 추가
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: infinite_test
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # [수정 1] 존재하지 않는 v6 대신 v4 사용!
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # [수정 2 & 3] 테스트와 bootJar를 동시에 실행하고, 상단의 MySQL/Redis 서비스와 연결!
      - name: Build and Test with Gradle
        run: ./gradlew test bootJar --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # 방금 띄운 서비스의 MySQL로 연결하도록 변수 강제 주입
          RDS_HOST: localhost
          RDS_USERNAME: root
          RDS_PASSWORD: test
          AWS_REGION: ap-northeast-2
          # 보안 피드백 반영: dummy 제거
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_S3_BUCKET: ''
          JWT_SECRET_KEY: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLWJhc2U2NA==

      # [수정 1] v6 대신 v4 사용!
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          REPO_URL=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          docker build --platform linux/amd64 \
            -t $REPO_URL:$SHORT_SHA \
            -t $REPO_URL:latest .
          
          docker push $REPO_URL:$SHORT_SHA
          docker push $REPO_URL:latest
          
          echo "✅ Pushed x86_64 Image for t3.small"

  deploy:
    needs: build
    if: contains(fromJson('["refs/heads/main", "refs/heads/develop", "refs/heads/hotfix/env/var"]'), github.ref)
    runs-on: ubuntu-latest

    steps:
      # [수정 1] v6 대신 v4 사용!
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 2-1: .env 파일 생성 및 S3 업로드 (printf 보안 강화)
      - name: Create and Upload .env to S3
        env:
          RDS_HOST: ${{ vars.RDS_HOST }}
          RDS_USERNAME: ${{ vars.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          # [수정] 쉘 변수 치환 취약점 방어를 위해 printf %s 포맷 사용
          printf 'SPRING_PROFILES_ACTIVE=prod\nRDS_HOST=%s\nRDS_USERNAME=%s\nRDS_PASSWORD=%s\nREDIS_HOST=%s\nREDIS_PORT=%s\nS3_BUCKET_NAME=%s\nJWT_SECRET_KEY=%s\n' \
            "$RDS_HOST" "$RDS_USERNAME" "$RDS_PASSWORD" "$REDIS_HOST" "$REDIS_PORT" "$S3_BUCKET_NAME" "$JWT_SECRET_KEY" > .env
          
          aws s3 cp .env s3://${S3_BUCKET_NAME}/deploy/.env

      # Step 2-2: Launch Template 새 버전 생성 (trap EXIT 보안 강화)
      - name: Update Launch Template
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
        run: |
          USER_DATA=$(cat <<'USERDATA' | sed \
            "s|__IMAGE_TAG__|${IMAGE_TAG}|g; \
             s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g; \
             s|__AWS_REGION__|${AWS_REGION}|g; \
             s|__ECR_REPOSITORY__|${ECR_REPOSITORY}|g; \
             s|__S3_BUCKET_NAME__|${S3_BUCKET_NAME}|g" | base64 -w 0
          #!/bin/bash
          set -e
          
          # 🌟 [수정] 스크립트 최상단에 trap 선언! 중간에 에러로 종료되더라도 무조건 삭제됨
          trap 'rm -f /tmp/.env' EXIT
          
          dnf update -y
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
          
          aws s3 cp s3://__S3_BUCKET_NAME__/deploy/.env /tmp/.env
          chmod 600 /tmp/.env
          
          aws ecr get-login-password --region __AWS_REGION__ | docker login --username AWS --password-stdin __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com
          docker pull __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/__ECR_REPOSITORY__:__IMAGE_TAG__
          
          docker run -d -p 8080:8080 --restart unless-stopped --name ci-demo \
            --env-file /tmp/.env \
            __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/__ECR_REPOSITORY__:__IMAGE_TAG__
          
          # (하단의 rm -f /tmp/.env 는 이제 trap이 알아서 해주므로 삭제했습니다)
          USERDATA
          )

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"$USER_DATA\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          aws ec2 modify-launch-template \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --default-version "$NEW_VERSION"

      - name: Start Instance Refresh
        id: refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${ASG_NAME} \
            --preferences '{"MinHealthyPercentage": 100, "InstanceWarmup": 120}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT

      - name: Wait for Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${ASG_NAME} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            if [ "${STATUS}" = "Successful" ]; then exit 0; fi
            if [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then exit 1; fi
            sleep 30
          done
          exit 1