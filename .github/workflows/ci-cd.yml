name: CI/CD Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main,develop]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용 (체크아웃 - Repo에 있는 코드를 Runner에 옮김)

jobs:
  build:
    runs-on: ubuntu-latest
      # ── [추가] Redis 컨테이너 서비스 ──
    services:
        redis:
          image: redis:latest
          ports:
            - 6379:6379
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        mysql:
          image: mysql:8.0
          ports:
            - 3306:3306
          env:
            MYSQL_ROOT_PASSWORD: test
            MYSQL_DATABASE: infinite_test
          options: >-
            --health-cmd "mysqladmin ping -h localhost"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 커밋 해시 추출
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 3: 스프링 빌드를 위한 Java 21 설치
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      # Step 4-1: 실행 권한 부여 (추가 권장)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4-2: 테스트 실행
      - name: Build and Test with Gradle
        # -x test를 제거하여 테스트를 강제하고, 테스트 성공 시에만 bootJar가 실행됩니다.
        run: ./gradlew build -x test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # application.yml에서 사용하는 정확한 변수명으로 매핑하세요!
          AWS_REGION: ap-northeast-2
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          # 👈 이 부분! 만약 yml에 ${AWS_S3_BUCKET}라고 되어있다면 아래처럼 맞춰야 합니다.
          AWS_S3_BUCKET: dummy-bucket
          # 만약 S3_BUCKET_NAME으로 쓰고 싶다면 yml도 ${S3_BUCKET_NAME}이어야 합니다.

          JWT_SECRET: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLWJhc2U2NA==
          JWT_SECRET_KEY: dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLWJhc2U2NA==

          JWT_EXPIRATION: 3600000

      # Step 5: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 6: ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 7: Docker 빌드 및 push (t3 전용 amd64 설정)
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          REPO_URL=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          # 🌟 [핵심수정] --platform을 linux/amd64로 변경 (t3용)
          # 밖에서 빌드한 JAR를 사용하므로 Dockerfile도 COPY만 하는 구조여야 합니다.
          docker build --platform linux/amd64 \
            -t $REPO_URL:$SHORT_SHA \
            -t $REPO_URL:latest .
          
          docker push $REPO_URL:$SHORT_SHA
          docker push $REPO_URL:latest
          
          echo "✅ Pushed x86_64 Image for t3.small"


  deploy:
    needs: build
    if: contains(fromJson('["refs/heads/main", "refs/heads/develop"]'), github.ref)
    runs-on: ubuntu-latest

    steps:
      # Step 1: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 2-1: .env 파일 생성 및 S3 업로드 (보안/성능 강화 버전)
      - name: Create and Upload .env to S3
        env:
          # 1. 깃허브 변수를 '환경 변수'로 먼저 안전하게 매핑 (이스케이핑 보장)
          RDS_HOST: ${{ vars.RDS_HOST }}
          RDS_USERNAME: ${{ vars.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          # 2. 여기서는 실제 .env 값을 만들어야 하므로 quoted heredoc(<<'EOF')를 쓰면 안 된다.
          #    quoted heredoc은 ${JWT_SECRET_KEY} 같은 변수를 literal 문자열로 남겨
          #    애플리케이션 런타임 설정을 깨뜨린다.
          #    현재 방식은 runner env 값을 파일로만 리다이렉트하며,
          #    로그 노출 방어는 GitHub Secrets masking + 불필요한 cat/set -x 금지로 관리한다.
          cat <<EOF > .env
          SPRING_PROFILES_ACTIVE=prod
          RDS_HOST=${RDS_HOST}
          RDS_USERNAME=${RDS_USERNAME}
          RDS_PASSWORD=${RDS_PASSWORD}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          S3_BUCKET_NAME=${S3_BUCKET_NAME}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
          APP_SEED_SHOWCASE_DATA=true
          APP_SEED_SHOWCASE_PASSWORD=demo1234!
          EOF
          
          # 3. 업로드 (변수명 오타 주의!)
          aws s3 cp .env s3://${S3_BUCKET_NAME}/deploy/.env

      # Step 2-2: Launch Template 새 버전 생성
      - name: Update Launch Template
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
        run: |
          USER_DATA=$(cat <<'USERDATA' | sed \
            "s|__IMAGE_TAG__|${IMAGE_TAG}|g; \
             s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g; \
             s|__AWS_REGION__|${AWS_REGION}|g; \
             s|__ECR_REPOSITORY__|${ECR_REPOSITORY}|g; \
             s|__S3_BUCKET_NAME__|${S3_BUCKET_NAME}|g" | base64 -w 0
          #!/bin/bash
          set -e
          
          # 동적 변수 선언 (리뷰어 피드백 반영: 하드코딩 제거)
          APP_CONTAINER_NAME="infinite-app-container"
          
          dnf update -y
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
          
          # EC2 부팅 시 S3에서 .env 파일 다운로드
          aws s3 cp s3://__S3_BUCKET_NAME__/deploy/.env /tmp/.env
          chmod 600 /tmp/.env
          
          # ECR 로그인 및 이미지 Pull
          aws ecr get-login-password --region __AWS_REGION__ | docker login --username AWS --password-stdin __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com
          docker pull __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/__ECR_REPOSITORY__:__IMAGE_TAG__
          
          # 컨테이너 실행 (변수 사용)
          docker run -d -p 8080:8080 --restart unless-stopped --name ${APP_CONTAINER_NAME} \
            --env-file /tmp/.env \
            __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/__ECR_REPOSITORY__:__IMAGE_TAG__
          
          # Spring Boot 헬스체크 폴링 (리뷰어 피드백 반영: 들여쓰기 완벽 정렬)
          echo "Starting health check polling..."
          SUCCESS=false
          
          for i in $(seq 1 30); do
            # HTTP 상태 코드 추출 (명령어 실패 시 000 반환하도록 예외 처리 추가)
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
          
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "✅ Application is healthy!"
              SUCCESS=true
              break
            fi
          
            echo "Waiting for application to start... ($i/30)"
            sleep 10
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Application did not start within 300 seconds."
            # 실패 시 동적 변수를 활용하여 해당 컨테이너 로그 출력
            docker logs ${APP_CONTAINER_NAME}
            exit 1
          fi
          
          # 사용이 끝난 .env 파일 삭제 (보안)
          rm -f /tmp/.env
          USERDATA
          )

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"$USER_DATA\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "✅ Launch Template v${NEW_VERSION} 생성 완료"

          aws ec2 modify-launch-template \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --default-version "$NEW_VERSION"

          echo "✅ 기본 버전 → v${NEW_VERSION} 변경 완료"

      # Step 3: Instance Refresh 시작
      - name: Start Instance Refresh
        id: refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${ASG_NAME} \
            --preferences '{
              "MinHealthyPercentage": 100,
              "InstanceWarmup": 120
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "✅ Instance Refresh 시작: ${REFRESH_ID}"

      # Step 4: Instance Refresh 완료 대기
      - name: Wait for Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          echo "⏳ Instance Refresh 완료 대기 중..."

          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${ASG_NAME} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "시도 ${i}/30 - 상태: ${STATUS}"

            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ Instance Refresh 성공! 배포 완료!"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ Instance Refresh 실패: ${STATUS}"
              exit 1
            fi

            sleep 30
          done

          echo "❌ Instance Refresh 타임아웃 (15분 초과)"
          exit 1
