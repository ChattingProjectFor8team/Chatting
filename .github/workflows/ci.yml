name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main,develop]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용 (체크아웃 - Repo에 있는 코드를 Runner에 옮김)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 스프링 빌드를 위한 Java 21 설치
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      # Step 3: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            

      # Step 4-1: 실행 권한 부여 (추가 권장)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4-2: 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # Step 5: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 6: ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 7: Docker 빌드 및 push (보완 버전)
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # 변수 가독성을 위해 REPO_URL 설정
          REPO_URL=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          # 1. 빌드 (플랫폼은 대상 EC2 사양에 맞춰 수정하세요)
          docker build --platform linux/amd64 \
            -t $REPO_URL:$SHORT_SHA \
            -t $REPO_URL:latest .
          
          # 2. 모든 태그 Push
          docker push $REPO_URL:$SHORT_SHA
          docker push $REPO_URL:latest
          
          echo "✅ Pushed Image Tag: $SHORT_SHA and latest"
