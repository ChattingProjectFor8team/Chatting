# 로컬 개발용 MySQL/Redis 컨테이너를 함께 띄운다.
services:
  mysql:
    image: mysql:8.4
    container_name: springchatting-local-mysql
    environment:
      # 애플리케이션 로컬 설정과 동일한 계정/DB를 만든다.
      MYSQL_DATABASE: springchatting
      MYSQL_USER: local_user
      MYSQL_PASSWORD: local_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    ports:
      - "33306:3306"
    volumes:
      # 로컬 재기동 시 데이터 보존을 위해 볼륨을 사용한다.
      - springchatting-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: springchatting-local-redis
    ports:
      - "6380:6379"
    volumes:
      # Redis 재기동 시 로컬 데이터를 유지한다.
      - springchatting-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: springchatting-local-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--enable-feature=envvar-expansion' # 환경 변수 사용을 위해 반드시 필요!
    environment:
      # 로컬 개발 환경이므로 로컬 애플리케이션 포트를 가리키도록 설정
      - PROMETHEUS_TARGET=host.docker.internal:8080
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway" # 도커 컨테이너에서 로컬 호스트에 접속하기 위함

volumes:
  springchatting-mysql-data:
  springchatting-redis-data:
